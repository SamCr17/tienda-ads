# nginx/nginx.conf

# Log que registra a que backend (upstream) se envio cada peticion,
# para evidenciar el ruteo del Strangler Pattern en `docker compose logs nginx`.
log_format strangler '$remote_addr [$time_local] "$request" $status '
                     '-> backend=$upstream_name ($upstream_addr)';

upstream django_v1 {
    server web_django:8000;
}

upstream flask_v2 {
    server pagos_flask:5000;
}

server {
    listen 80;

    access_log /var/log/nginx/access.log strangler;

    # RUTA VIEJA: Sigue yendo a Django
    location /api/v1/ {
        set $upstream_name django_v1;
        proxy_pass http://django_v1;
        proxy_set_header Host $host;
    }

    # RUTA NUEVA: Estrangulamos la funcion de compra y la mandamos a Flask
    location /api/v2/comprar {
        set $upstream_name flask_v2;
        proxy_pass http://flask_v2;
        proxy_set_header Host $host;
    }

    # Todo lo que aun no se ha migrado (paginas HTML, admin, /static/)
    # sigue yendo al monolito: esa es la esencia del Strangler Pattern.
    location / {
        set $upstream_name django_v1;
        proxy_pass http://django_v1;
        proxy_set_header Host $host;
    }
}
